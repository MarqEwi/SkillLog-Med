<?xml version="1.0" encoding="UTF-8"?>
<!-- SkillLog Med – Logo-Quelle. Motiv: Klemmbrett (Logbuch) mit EKG-Linie
     (klinische Maßnahmen) und Haken (dokumentiert). Farbwelt: klinisches
     Blau – bewusst weit weg von Petrol (Never2Late) und den Fitness-Apps
     der Familie. Aus dieser Datei werden alle Icons erzeugt
     (scripts/icons-bauen.mjs). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155e9e"/>
      <stop offset="1" stop-color="#2b87cd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Klemmbrett mit Halteklammer oben -->
    <rect x="118" y="104" width="240" height="312" rx="36"/>
    <path d="M186 104v-10a30 30 0 0130-30h44a30 30 0 0130 30v10"/>
    <!-- EKG-Linie: ein einzelner PQRST-Komplex, derselbe Rhythmus wie im Marken-Hintergrund -->
    <path d="M152 250h30q13-26 26 0h10l5 10 10-88 12 112 8-34h8q16-30 32 0h45" stroke-width="24"/>
  </g>
  <!-- Haken-Plakette, überlappt die untere rechte Ecke des Klemmbretts.
       Der äußere Kreis stanzt den Brettrahmen aus und trägt deshalb die
       Hintergrundfarbe; beim adaptiven Android-Icon wird er auf die dortige
       (einfarbige) Hintergrundfarbe umgestellt – siehe scripts/icons-bauen.mjs. -->
  <circle id="stanze" cx="368" cy="368" r="94" fill="url(#bg)"/>
  <circle cx="368" cy="368" r="80" fill="#ffffff"/>
  <path d="M332 368l26 26 48-52" fill="none" stroke="#155e9e" stroke-width="22"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
